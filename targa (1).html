<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Targa Matricola — Antico Olindo e Cesare</title>
<style>
  :root{
    --steel-1:#eef1f4; --steel-2:#d6dbe0; --steel-3:#c4cbd2; --engrave:#1b2129; --engrave-soft:#3c4653; --edge:#9aa4ad;
    --bg:#0c1219; --accent:#2f6fb0; --ok:#2e7d32;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:linear-gradient(180deg,#0c1219,#0e1620);min-height:100vh;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#cfe0f0;
    display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px}

  .card{width:100%;max-width:460px}

  /* TARGA de acero */
  .targa{width:100%;color:var(--engrave);
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.30) 0 1px, rgba(0,0,0,0) 1px 3px),
      linear-gradient(160deg, var(--steel-1), var(--steel-3) 60%, var(--steel-2));
    border:2px solid var(--edge);border-radius:10px;padding:18px 20px;position:relative;
    box-shadow:0 12px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.65)}
  .rv{position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#f4f6f8,#7f8a94 70%,#59636c);box-shadow:inset 0 0 2px rgba(0,0,0,.4)}
  .rv.tl{top:8px;left:8px}.rv.tr{top:8px;right:8px}.rv.bl{bottom:8px;left:8px}.rv.br{bottom:8px;right:8px}

  .logo{background:#fff;border-radius:8px;padding:8px 10px;text-align:center;margin-bottom:12px}
  .logo img{max-width:220px;width:100%;height:auto;display:block;margin:0 auto}
  .addr{font-size:10px;color:var(--engrave-soft);text-align:center;margin-top:4px;letter-spacing:.3px}

  .sect{border-top:1.5px solid var(--engrave-soft);margin-top:12px;padding-top:10px}
  .sect-t{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--engrave-soft);font-weight:800;margin-bottom:8px}
  .row{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:12.5px}
  .row .k{color:var(--engrave-soft);font-weight:600}
  .row .v{font-family:"Consolas","SF Mono",monospace;font-weight:700;text-align:right;word-break:break-word}
  .ce{display:inline-block;border:2px solid var(--engrave);border-radius:4px;padding:1px 6px;font-weight:800;font-size:12px;margin-left:6px}

  /* Bloque manual (Art. 10.7) */
  .manual{margin-top:12px;background:#0f1826;border:1px solid #26364a;border-radius:12px;padding:14px;color:#cfe0f0}
  .manual .mt{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8fa4bc;font-weight:700;margin-bottom:8px}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;border:none;border-radius:10px;
    padding:13px;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:8px}
  .btn.pri{background:var(--accent);color:#fff}
  .btn.sec{background:#1a2432;color:#cfe0f0;border:1px solid #2a3a4e}
  .meta{font-size:11px;color:#8fa4bc;text-align:center;margin-top:4px}
  .err{background:#2a1618;border:1px solid #6b2a2f;color:#f3b0b4;border-radius:10px;padding:12px;font-size:12.5px;text-align:center}
  .legal{font-size:9.5px;color:#5f7488;line-height:1.5;text-align:center;margin-top:12px;max-width:460px}
  .empty{background:#121a24;border:1px solid #233042;border-radius:12px;padding:22px;text-align:center;color:#9fb3c8}
  .empty b{color:#cfe0f0}
</style>
</head>
<body>
  <div id="content" class="card"></div>
  <div class="legal card" id="legal"></div>
