<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Targa macchina — Antico Olindo e Cesare</title>
  <style>
    :root {
      --bg: #0a0f1c;
      --card: #131b2e;
      --line: #233047;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #5b91b5;
      --green: #15803d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse 900px 400px at 50% -5%, rgba(29,78,216,0.12), transparent), var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px 40px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .brand {
      text-align: center; margin-bottom: 18px; padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .brand .logo {
      width: 56px; height: 56px; margin: 0 auto 10px;
      border: 2px solid #94a3b8; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.4rem; color: #cbd5e1;
      background: #0f172a;
    }
    .brand h1 { font-size: 1.05rem; letter-spacing: 0.04em; }
    .brand .addr { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 16px 18px; margin-bottom: 14px;
    }
    .card h2 {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--accent); margin-bottom: 12px;
    }
    .row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 7px 0; border-bottom: 1px solid rgba(35,48,71,0.7);
      font-size: 0.9rem;
    }
    .row:last-child { border-bottom: none; }
    .row .k { color: var(--muted); flex: 0 0 42%; }
    .row .v { font-weight: 650; text-align: right; word-break: break-word; font-family: ui-monospace, Consolas, monospace; font-size: 0.86rem; }
    .manual-btn {
      display: block; width: 100%; text-align: center;
      background: var(--green); color: #fff; text-decoration: none;
      font-weight: 700; padding: 14px 16px; border-radius: 8px;
      font-size: 0.95rem; margin-top: 4px;
    }
    .manual-btn:active { opacity: 0.9; }
    .manual-meta { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
    .legal {
      margin-top: 18px; font-size: 0.7rem; color: #64748b; line-height: 1.55;
      text-align: center; padding: 0 8px;
    }
    .err {
      background: #201615; border: 1px solid #a94747; color: #c99494;
      border-radius: 8px; padding: 14px; font-size: 0.88rem; line-height: 1.5;
    }
    .badge {
      display: inline-block; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      background: #1e293b; color: #94a3b8; border: 1px solid #334155;
      border-radius: 3px; padding: 2px 7px; margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="brand">
      <div class="logo">AO</div>
      <h1 id="empresa">Antico Olindo e Cesare S.r.l.</h1>
      <div class="addr" id="indirizzo">Via Savona 26, 20144 Milano, Italy</div>
    </div>

    <div id="content"></div>

    <p class="legal">
      Istruzioni d'uso in formato digitale — Regolamento (UE) 2023/1230 Art. 10.7.<br>
      Pagina di identificazione macchina (PoC). In produzione: hosting del fabbricante, disponibilità ≥ 10 anni.
    </p>
  </div>

  <script>
  (function () {
    function q(key) {
      try {
        var v = new URLSearchParams(window.location.search).get(key);
        return (v == null || v === '') ? '' : v;
      } catch (e) { return ''; }
    }
    function row(k, v) {
      if (v === '' || v == null) return '';
      return '<div class="row"><span class="k">' + k + '</span><span class="v">' + escapeHtml(String(v)) + '</span></div>';
    }
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    var empresa = q('empresa') || 'Antico Olindo e Cesare S.r.l.';
    var indirizzo = q('indirizzo') || 'Via Savona 26, 20144 Milano, Italy';
    document.getElementById('empresa').textContent = empresa;
    document.getElementById('indirizzo').textContent = indirizzo;

    var macchina = q('macchina');
    var matricola = q('matricola');
    var manualUrl = q('manualUrl');

    if (!matricola && !macchina) {
      document.getElementById('content').innerHTML =
        '<div class="err">Nessun dato macchina nel QR.<br>Scansionare un codice generato dalla HMI di collaudo oppure aprire un URL con parametri <code>matricola</code> e <code>manualUrl</code>.</div>';
      return;
    }

    var motoreParts = [];
    if (q('kw')) motoreParts.push(q('kw') + ' kW');
    if (q('v')) motoreParts.push(q('v') + ' V');
    if (q('hz')) motoreParts.push(q('hz') + ' Hz');
    if (q('poli')) motoreParts.push(q('poli') + ' poli');
    if (q('rpmEje')) motoreParts.push(q('rpmEje') + ' rpm asse');
    else if (q('rpm')) motoreParts.push(q('rpm') + ' rpm sync');
    if (q('in')) motoreParts.push('In ' + q('in') + ' A');
    if (q('cos')) motoreParts.push('cosφ ' + q('cos'));
    if (q('eta')) motoreParts.push('η ' + q('eta') + '%');

    var girante = q('girante');
    if (q('diam')) girante = (girante ? girante + ' · ' : '') + 'Ø' + q('diam') + ' mm';
    if (q('np')) girante = (girante ? girante + ' · ' : '') + 'Np ' + q('np');

    var html = '';
    html += '<div class="card"><span class="badge">Identificazione</span><h2>Macchina</h2>';
    html += row('Tipo / modello', macchina);
    html += row('Matricola', matricola);
    html += row('Anno', q('anno') || (q('data') || '').slice(0, 4));
    html += row('Data', q('data'));
    html += row('Massa (kg)', q('massa'));
    html += row('Collaudo ID', q('collaudoId'));
    html += '</div>';

    html += '<div class="card"><h2>Motore / trasmissione</h2>';
    html += row('Dati', motoreParts.join(' · '));
    html += '</div>';

    if (girante) {
      html += '<div class="card"><h2>Girante di riferimento</h2>';
      html += row('Modello / Ø', girante);
      html += '</div>';
    }

    html += '<div class="card"><h2>Istruzioni d\'uso</h2>';
    if (manualUrl) {
      var safeHref = escapeHtml(manualUrl);
      html += '<a class="manual-btn" href="' + safeHref + '" target="_blank" rel="noopener">📄 Scarica / apri il manuale PDF</a>';
      html += '<div class="manual-meta">Revisione ' + escapeHtml(q('manualRev') || '1') +
              ' · Lingua ' + escapeHtml((q('manualLang') || 'it').toUpperCase()) +
              (q('manualDate') ? ' · ' + escapeHtml(q('manualDate')) : '') + '</div>';
    } else {
      html += '<div class="err">URL del manuale non presente nel QR (<code>manualUrl</code>). Configurarla nella HMI (Admin → QR Targa).</div>';
    }
    html += '</div>';

    document.getElementById('content').innerHTML = html;
  })();
  </script>
</body>
</html>
